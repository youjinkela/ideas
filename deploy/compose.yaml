services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      IDEA_ECHO_DATA: /data
    volumes:
      - ../data/server:/data
      - ../data/backups:/backups
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      IDEA_DOMAIN: ${IDEA_DOMAIN:?Set IDEA_DOMAIN to your filed domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 192m
volumes:
  caddy_data:
  caddy_config:
