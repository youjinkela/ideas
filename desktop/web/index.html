<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点子回声 · 晚间回顾</title><link rel="stylesheet" href="/assets/styles.css"><script src="/assets/app.js" defer></script></head><body>
<header><div class="brand">点子回声 <small>给白天的灵感，一个晚上的回应</small></div><div class="toolbar"><span id="appStatus">正在连接本机…</span><button id="sync">同步</button><button id="settingsOpen">设置</button></div></header>
<main><div class="intro"><div><span class="eyebrow">每天 19:00 · 留一点时间给自己的想法</span><h1>捡起今天的点子。</h1><p>回看、整理，把值得继续的想法留下来。</p></div><div class="badge" id="count">待回顾</div></div>
<div class="grid"><aside class="panel"><div class="listHeader"><h2>点子收件箱</h2><select id="view" aria-label="点子视图"><option value="pending">待回顾</option><option value="all">全部记录</option></select></div><div id="ideaList"></div><p class="hint">离线点子要先在手机完成上传，才会出现在这里。</p></aside>
<section class="panel editor"><div id="empty"><h2>给想法一个落点。</h2><p>在手机 App 记下点子，连接云端后，它们会来到这里。</p><button id="emptySettings">连接我的服务器</button></div><div id="workspace" hidden><div class="eyebrow" id="recordedAt"></div><h2 id="ideaTitle"></h2><div id="raw" class="raw"></div><div id="ideaImages" class="images"></div><div id="conflicts"></div><label for="reflection">现在再看，你又想到了什么？</label><textarea id="reflection" placeholder="可以是一句话，也可以继续展开……"></textarea><div id="saveStatus" class="hint">编辑自动保存到本机</div><div class="actions"><button id="archive" class="primary">记入 Obsidian →</button><button id="later">留待下次</button><button id="reviewed">已回顾</button></div></div></section>
</div></main>
<div id="notice" role="status" hidden></div>
<dialog id="archiveDialog"><div class="dialogHead"><h2>记入 Obsidian</h2><button data-close="archiveDialog" aria-label="关闭归档">×</button></div><p class="hint">选择位置后预览，确认才会写入。</p><label for="archiveMode">保存方式</label><select id="archiveMode"><option value="new">新建笔记（默认）</option><option value="append">追加到已有笔记</option></select><div id="newFields"><label for="noteTitle">笔记标题</label><input id="noteTitle"><label for="folder">归档文件夹</label><select id="folder"></select></div><div id="appendFields" hidden><label for="noteSearch">搜索已有笔记</label><input id="noteSearch" placeholder="笔记标题或目录"><label for="targetNote">目标笔记</label><select id="targetNote"></select></div><button id="previewArchive">预览归档内容</button><div id="archiveDestination" class="hint"></div><pre id="archivePreview"></pre><div class="actions"><button data-close="archiveDialog">取消</button><button class="primary" id="commitArchive" disabled>确认保存</button></div></dialog>
<dialog id="settingsDialog"><div class="dialogHead"><h2>我的连接</h2><button data-close="settingsDialog" aria-label="关闭设置">×</button></div><h3>云端收件箱</h3><label for="cloudUrl">服务器根地址</label><input id="cloudUrl" placeholder="https://ideas.example.com" autocomplete="url"><label for="cloudUser">用户名</label><input id="cloudUser" autocomplete="username"><label for="cloudPassword">登录密码（不保存）</label><input id="cloudPassword" type="password" autocomplete="current-password"><h3>本地 Obsidian</h3><button id="chooseVault">选择笔记库文件夹</button><p id="vaultPath" class="hint">尚未选择</p><button id="saveSettings" class="primary">保存连接设置</button></dialog>
<dialog id="imageDialog"><button data-close="imageDialog">关闭图片</button><img id="largeImage" alt="点子原图"></dialog>
</body></html>
