[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "idea-echo-desktop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["idea-echo-server==0.1.0", "tzdata>=2025", "winotify>=1.1,<2; sys_platform == 'win32'"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["."]
include = ["idea_echo_desktop*"]

