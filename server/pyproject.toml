[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "idea-echo-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.159.1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "argon2-cffi>=23,<26", "Pillow>=12,<13", "jsonschema>=4.23,<5"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["."]
include = ["idea_echo*"]

